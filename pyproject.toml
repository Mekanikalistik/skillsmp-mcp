[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillsmp-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) server for SkillsMP - search and fetch AI agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ahmet Tavsan" }
]
keywords = ["mcp", "skillsmp", "agent-skills", "llm", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
skillsmp-mcp = "skillsmp_mcp.server:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsmp_mcp"]
